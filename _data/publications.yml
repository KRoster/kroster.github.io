# ------------------------------------------------------------------------------
# Publications — single source of truth for the site.
#
# The Publications page numbers these automatically, counting DOWN the page, so
# the newest paper always carries the highest number. The Research page pulls
# the same entries by `id`, so a citation is only ever written once.
#
# To add a paper: add a new block at the TOP of this list and give it a unique
# `id`. Optionally list which research themes it belongs to (t1-t4, defined in
# _pages/research.md).
#
# Fields:
#   id       (required) unique short key, referenced from the Research page
#   authors  (required) as on the paper; "Oliveira Roster K" is bolded for you
#   title    (required) HTML allowed, e.g. <em>Neisseria gonorrhoeae</em>
#   journal  (required) rendered in italics
#   year     (required)
#   pmid / pmcid       optional; a PMID becomes a PubMed link
#   url                optional; overrides the PubMed link (e.g. a DOI or preprint)
#   note               optional; small note shown after the citation
#   themes             optional; list of theme keys
# ------------------------------------------------------------------------------

